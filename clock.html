<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Widget</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --bg2:       #f7f6f3;
    --text:      #37352f;
    --text-dim:  #9b9a97;
    --accent:    #2eaadc;
    --bar-bg:    #e9e9e7;
    --radius:    10px;
    --font:      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono:      "SF Mono", "Fira Mono", "Cascadia Code", "Consolas", monospace;
  }

  body.dark {
    --bg:       #191919;
    --bg2:      #252525;
    --text:     #e6e6e4;
    --text-dim: #6b6b69;
    --bar-bg:   #333333;
  }

  /* Color presets */
  body.color-blue   { --accent: #2eaadc; }
  body.color-purple { --accent: #9b59b6; }
  body.color-green  { --accent: #27ae60; }
  body.color-orange { --accent: #f39c12; }
  body.color-pink   { --accent: #e91e8c; }
  body.color-red    { --accent: #e74c3c; }
  body.color-teal   { --accent: #1abc9c; }
  body.color-yellow { --accent: #f1c40f; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    transition: background .3s, color .3s;
  }

  .clock-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }

  /* ── Digital Style ─────────────────────────────── */
  .digital .time-row {
    display: flex;
    align-items: center;
    font-family: var(--mono);
    font-size: clamp(2.2rem, 10vw, 4rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
  }

  .digital .colon {
    color: var(--accent);
    padding: 0 2px;
    transition: opacity 0.1s;
  }

  .digital .seconds {
    font-size: clamp(1.4rem, 6vw, 2.5rem);
    color: var(--accent);
    align-self: flex-end;
    padding-bottom: 0.15em;
    margin-left: 4px;
  }

  .digital .date-row {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-top: 2px;
  }

  /* ── Minimal Style ─────────────────────────────── */
  .minimal .time-row {
    display: flex;
    align-items: center;
    font-size: clamp(2.8rem, 12vw, 5.5rem);
    font-weight: 200;
    letter-spacing: -0.04em;
    color: var(--text);
    line-height: 1;
  }

  .minimal .colon {
    color: var(--accent);
    padding: 0 4px;
    transition: opacity 0.1s;
    font-weight: 100;
  }

  .minimal .seconds {
    font-size: clamp(1rem, 4vw, 1.8rem);
    color: var(--accent);
    font-weight: 300;
    align-self: flex-end;
    padding-bottom: 0.2em;
    margin-left: 6px;
  }

  .minimal .date-row {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── Big Style ─────────────────────────────────── */
  .big .arc-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .big .arc-svg {
    position: absolute;
    top: 0; left: 0;
    transform: rotate(-90deg);
  }

  .big .arc-track {
    fill: none;
    stroke: var(--bar-bg);
    stroke-width: 5;
  }

  .big .arc-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s cubic-bezier(.4,0,.2,1);
  }

  .big .inner-time {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .big .hour-num {
    font-size: clamp(3.5rem, 18vw, 7rem);
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.03em;
  }

  .big .min-num {
    font-size: clamp(1rem, 5vw, 2rem);
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .big .date-row {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="clock-wrap" id="clock"></div>

<script>
const P = new URLSearchParams(location.search);

const rawTz = P.get('tz');
// Detect timezone name (e.g. "Asia/Shanghai") vs numeric offset (e.g. "8")
let tzName = null;
let tzOffset = null;
if (rawTz !== null) {
  const num = parseFloat(rawTz);
  if (!isNaN(num) && /^-?\d+(\.\d+)?$/.test(rawTz)) {
    tzOffset = num;
  } else {
    tzName = rawTz;  // e.g. "Asia/Shanghai", "America/New_York"
  }
}

const cfg = {
  style:       P.get('style') || 'digital',
  dark:        P.get('dark') === 'true' || matchMedia('(prefers-color-scheme:dark)').matches,
  lang:        P.get('lang') || 'en',
  tzName,
  tzOffset,
  color:       P.get('color') || 'blue',
  showdate:    P.get('showdate') !== 'false',
  showseconds: P.get('showseconds') !== 'false',
};

if (cfg.dark) document.body.classList.add('dark');
document.body.classList.add('color-' + cfg.color);

function getNow() {
  const now = new Date();
  if (cfg.tzName) {
    // Use Intl API to convert to named timezone
    const parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: cfg.tzName,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false,
    }).formatToParts(now).forEach(p => { parts[p.type] = p.value; });
    return new Date(
      +parts.year, +parts.month - 1, +parts.day,
      +parts.hour === 24 ? 0 : +parts.hour, +parts.minute, +parts.second
    );
  }
  if (cfg.tzOffset !== null) {
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utc + cfg.tzOffset * 3600000);
  }
  return now;
}

const DAYS_ZH = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const DAYS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function pad(n) { return String(n).padStart(2, '0'); }

function formatDate(d) {
  const wd = d.getDay();
  if (cfg.lang === 'zh') {
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日  ${DAYS_ZH[wd]}`;
  }
  return `${DAYS_EN[wd]}, ${MONTHS_EN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

// ── Digital ─────────────────────────────────────────────────────────
function renderDigital() {
  const wrap = document.getElementById('clock');
  wrap.innerHTML = `<div class="digital" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:100%">
    <div class="time-row">
      <span id="d-h"></span><span class="colon" id="d-c1">:</span><span id="d-m"></span><span class="seconds" id="d-s" style="display:none"></span>
    </div>
    <div class="date-row" id="d-date" style="${cfg.showdate ? '' : 'display:none'}"></div>
  </div>`;
  if (cfg.showseconds) document.getElementById('d-s').style.display = '';
}

function tickDigital() {
  const now = getNow();
  const s = now.getSeconds();
  document.getElementById('d-h').textContent = pad(now.getHours());
  document.getElementById('d-m').textContent = pad(now.getMinutes());
  if (cfg.showseconds) document.getElementById('d-s').textContent = pad(s);
  const c1 = document.getElementById('d-c1');
  if (c1) c1.style.opacity = s % 2 === 0 ? '1' : '0.3';
  if (cfg.showdate) document.getElementById('d-date').textContent = formatDate(now);
}

// ── Minimal ─────────────────────────────────────────────────────────
function renderMinimal() {
  const wrap = document.getElementById('clock');
  wrap.innerHTML = `<div class="minimal" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:100%">
    <div class="time-row">
      <span id="m-h"></span><span class="colon" id="m-c1">:</span><span id="m-m"></span><span class="seconds" id="m-s" style="display:none"></span>
    </div>
    <div class="date-row" id="m-date" style="${cfg.showdate ? '' : 'display:none'}"></div>
  </div>`;
  if (cfg.showseconds) document.getElementById('m-s').style.display = '';
}

function tickMinimal() {
  const now = getNow();
  const s = now.getSeconds();
  document.getElementById('m-h').textContent = pad(now.getHours());
  document.getElementById('m-m').textContent = pad(now.getMinutes());
  if (cfg.showseconds) document.getElementById('m-s').textContent = pad(s);
  const c1 = document.getElementById('m-c1');
  if (c1) c1.style.opacity = s % 2 === 0 ? '1' : '0.3';
  if (cfg.showdate) document.getElementById('m-date').textContent = formatDate(now);
}

// ── Big ─────────────────────────────────────────────────────────────
const ARC_SIZE = 200;
const R = 88;
const CIRC = 2 * Math.PI * R;

function renderBig() {
  const wrap = document.getElementById('clock');
  wrap.innerHTML = `<div class="big" style="display:flex;flex-direction:column;align-items:center;gap:0;width:100%">
    <div class="arc-container" style="width:${ARC_SIZE}px;height:${ARC_SIZE}px;">
      <svg class="arc-svg" width="${ARC_SIZE}" height="${ARC_SIZE}" viewBox="0 0 ${ARC_SIZE} ${ARC_SIZE}">
        <circle class="arc-track" cx="${ARC_SIZE/2}" cy="${ARC_SIZE/2}" r="${R}"/>
        <circle class="arc-fill" id="b-arc" cx="${ARC_SIZE/2}" cy="${ARC_SIZE/2}" r="${R}"
          stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/>
      </svg>
      <div class="inner-time">
        <span class="hour-num" id="b-h"></span>
        <span class="min-num" id="b-m"></span>
      </div>
    </div>
    <div class="date-row" id="b-date" style="${cfg.showdate ? '' : 'display:none'}"></div>
  </div>`;
}

function tickBig() {
  const now = getNow();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  document.getElementById('b-h').textContent = pad(h);
  document.getElementById('b-m').textContent = pad(m);
  // Arc: minutes progress (0-60 → full circle), seconds add sub-minute precision
  const progress = (m * 60 + s) / 3600;
  const offset = CIRC * (1 - progress);
  document.getElementById('b-arc').style.strokeDashoffset = offset;
  if (cfg.showdate) document.getElementById('b-date').textContent = formatDate(now);
}

// ── Init ─────────────────────────────────────────────────────────────
let tick;
const style = cfg.style;
if (style === 'minimal') {
  renderMinimal();
  tick = tickMinimal;
} else if (style === 'big') {
  renderBig();
  tick = tickBig;
} else {
  renderDigital();
  tick = tickDigital;
}

tick();
setInterval(tick, 1000);

window.addEventListener('message', (e) => {
  if (e.data?.type === 'notion-color-scheme') {
    document.body.classList.toggle('dark', e.data.value === 'dark');
  }
});
</script>
</body>
</html>
